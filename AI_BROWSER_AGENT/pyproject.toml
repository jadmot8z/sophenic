[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-browser-agent"
version = "1.3.0"
description = "Agent navigateur local Windows avec Ollama et Chromium"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "playwright>=1.51,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "llm*", "browser*", "vision*", "memory*", "tools*", "interface*"]

[tool.setuptools.package-data]
interface = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
